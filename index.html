<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Rosa · École Directe</title>

<!-- POLICES -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&family=Noto+Serif+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root {
    --washi: #FAF6F0;
    --washi-dark: #F0E5D8;
    --sumi: #2E2A26;
    --sakura-deep: #8B3A3A;
    --sakura: #D4A5A5;
    --sakura-light: #F5DCDC;
    --bamboo: #7BA77B;
    --tea: #C9A370;
    --vermilion: #C97070;
    --gold: #B89A4E;
    --gold-dark: #8B6F33;
    --line: #E8D5C4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif JP', 'Sawarabi Mincho', serif;
    background: var(--washi);
    color: var(--sumi);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(212, 165, 165, 0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(123, 167, 123, 0.05) 0%, transparent 50%);
  }

  /* Pétales de sakura qui tombent */
  .sakura-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .petale {
    position: absolute;
    top: -40px;
    width: 14px;
    height: 14px;
    background: radial-gradient(ellipse at 30% 30%, #FFD9D9, #D4A5A5);
    border-radius: 0 100% 0 100%;
    opacity: 0.7;
    animation: tomber linear infinite;
  }
  @keyframes tomber {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 48px 20px 32px;
    background: linear-gradient(180deg, rgba(245, 220, 220, 0.4) 0%, transparent 100%);
  }
  header .torii {
    font-size: 36px;
    color: var(--sakura-deep);
    margin-bottom: 8px;
  }
  header h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 38px;
    font-weight: 500;
    letter-spacing: 12px;
    color: var(--sakura-deep);
    text-transform: uppercase;
    text-indent: 12px;
  }
  header .kanji {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 8px;
    margin-top: 4px;
  }
  header .date {
    margin-top: 12px;
    font-size: 13px;
    color: #8a7a6e;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  header .ornement {
    margin: 16px auto 0;
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sakura-deep), transparent);
    position: relative;
  }
  header .ornement::after {
    content: '❀';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--washi);
    padding: 0 8px;
    color: var(--sakura-deep);
    font-size: 14px;
  }

  /* NAV ONGLETS */
  nav.tabs {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.4);
    margin-bottom: 32px;
  }
  nav.tabs button {
    background: transparent;
    border: none;
    padding: 16px 28px;
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    color: #8a7a6e;
    cursor: pointer;
    letter-spacing: 3px;
    transition: all 0.3s;
    border-bottom: 3px solid transparent;
    position: relative;
  }
  nav.tabs button .kanji {
    display: block;
    font-size: 10px;
    color: var(--gold);
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  nav.tabs button:hover { color: var(--sakura-deep); }
  nav.tabs button.active {
    color: var(--sakura-deep);
    border-bottom-color: var(--sakura-deep);
    font-weight: 500;
  }

  /* CONTENEUR */
  main {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .panel { display: none; animation: fadeIn 0.5s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* CARTES */
  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(46, 42, 38, 0.04);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--sakura);
  }
  .card.urgent::before { background: var(--vermilion); }
  .card.important::before { background: var(--tea); }
  .card.fait { background: #F8F8F4; opacity: 0.6; }
  .card.fait::before { background: var(--bamboo); }
  .card.fait .contenu { text-decoration: line-through; color: #999; }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 8px;
  }
  .card-matiere {
    font-family: 'Shippori Mincho', serif;
    color: var(--sakura-deep);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 1px;
    flex: 1;
  }
  .card-meta {
    text-align: right;
    font-size: 11px;
    color: #999;
    letter-spacing: 1px;
  }
  .card-date {
    color: var(--sakura-deep);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
  }
  .card .contenu {
    color: #4a4138;
    line-height: 1.7;
    font-size: 14px;
    margin-top: 8px;
  }

  /* CHECKBOX */
  .check-fait {
    appearance: none;
    width: 26px;
    height: 26px;
    border: 1.5px solid var(--sakura-deep);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    transition: all 0.3s;
    background: white;
    flex-shrink: 0;
  }
  .check-fait:hover { background: var(--sakura-light); }
  .check-fait:checked { background: var(--bamboo); border-color: var(--bamboo); }
  .check-fait:checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 16px;
    font-weight: bold;
  }

  /* BADGES URGENCE */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 2px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .badge.urgent { background: #FCE5E5; color: var(--vermilion); border: 1px solid var(--vermilion); }
  .badge.important { background: #FAF0E1; color: var(--tea); border: 1px solid var(--tea); }
  .badge.normal { background: #EFF5EF; color: var(--bamboo); border: 1px solid var(--bamboo); }
  .badge.demain { background: var(--sakura-deep); color: white; }

  /* SECTION TITRE */
  .section-titre {
    display: flex;
    align-items: center;
    margin: 32px 0 16px;
    gap: 16px;
  }
  .section-titre h2 {
    font-family: 'Shippori Mincho', serif;
    color: var(--sakura-deep);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
  .section-titre .kanji {
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 4px;
  }
  .section-titre .ligne {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .section-titre.first { margin-top: 0; }

  /* NOTES - MOYENNE GENERALE */
  .moy-generale {
    background: linear-gradient(180deg, var(--sakura-light) 0%, var(--washi) 100%);
    border: 2px solid var(--sakura-deep);
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: 0 2px 12px rgba(139, 58, 58, 0.1);
    position: relative;
  }
  .moy-generale::before {
    content: '❀';
    position: absolute;
    top: -16px; left: 50%;
    transform: translateX(-50%);
    background: var(--washi);
    color: var(--sakura-deep);
    padding: 0 12px;
    font-size: 20px;
  }
  .moy-gen-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 12px;
    color: var(--sakura-deep);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .moy-gen-label .kanji-gold {
    display: block;
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .moy-gen-val {
    font-family: 'Shippori Mincho', serif;
    font-size: 72px;
    font-weight: 500;
    line-height: 1;
    margin: 8px 0;
    color: var(--sumi);
  }
  .moy-gen-val.bonne { color: var(--bamboo); }
  .moy-gen-val.moyenne { color: var(--tea); }
  .moy-gen-val.basse { color: var(--vermilion); }
  .moy-gen-val small { font-size: 24px; color: #b0a294; font-weight: 400; }
  .moy-gen-sub {
    font-size: 11px;
    color: #8a7a6e;
    letter-spacing: 2px;
    margin-top: 4px;
    font-family: 'Sawarabi Mincho', serif;
  }

  /* NOTES - BLOCS MATIERE */
  .matiere-bloc {
    background: white;
    border: 1px solid var(--line);
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(46, 42, 38, 0.04);
    overflow: hidden;
  }
  .matiere-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px 4px;
    border-bottom: none;
  }
  .matiere-titre {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--sakura-deep);
    letter-spacing: 1.5px;
  }
  .matiere-moy {
    font-family: 'Shippori Mincho', serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .matiere-moy.bonne { color: var(--bamboo); }
  .matiere-moy.moyenne { color: var(--tea); }
  .matiere-moy.basse { color: var(--vermilion); }
  .matiere-moy small { font-size: 14px; color: #b0a294; font-weight: 400; }
  .matiere-meta {
    font-family: 'Sawarabi Mincho', serif;
    font-size: 11px;
    color: #b0a294;
    padding: 0 22px 12px;
    letter-spacing: 1px;
  }
  .matiere-notes {
    background: var(--washi);
    border-top: 1px solid var(--line);
  }
  .note-ligne {
    display: grid;
    grid-template-columns: 70px 1fr 90px;
    align-items: center;
    gap: 16px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .note-ligne:last-child { border-bottom: none; }
  .note-ligne:hover { background: #fff9f0; }
  .note-date-jp {
    font-family: 'Sawarabi Mincho', serif;
    font-size: 12px;
    color: var(--sakura-deep);
    font-weight: 500;
    letter-spacing: 1px;
  }
  .note-devoir-jp {
    font-family: 'Sawarabi Mincho', serif;
    font-size: 13px;
    color: var(--sumi);
    line-height: 1.5;
  }
  .note-coef {
    display: inline-block;
    font-size: 10px;
    color: var(--gold-dark);
    background: rgba(184, 154, 78, 0.1);
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .note-classe-info {
    font-size: 10px;
    color: #b0a294;
    letter-spacing: 0.5px;
  }
  .note-valeur-jp {
    font-family: 'Shippori Mincho', serif;
    font-size: 22px;
    font-weight: 600;
    text-align: right;
    letter-spacing: 1px;
  }
  .note-valeur-jp.bonne { color: var(--bamboo); }
  .note-valeur-jp.moyenne { color: var(--tea); }
  .note-valeur-jp.basse { color: var(--vermilion); }
  .note-valeur-jp small { font-size: 12px; color: #b0a294; font-weight: 400; }

  /* NOTES TABLE (ancien, conservé pour compat) */
  .note-card {
    display: grid;
    grid-template-columns: 100px 1fr auto auto;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: white;
    border: 1px solid var(--line);
    margin-bottom: 6px;
    transition: all 0.2s;
  }
  .note-card:hover { background: #FFFCF8; }
  .note-date { font-size: 12px; color: #999; letter-spacing: 1px; }
  .note-matiere { font-family: 'Shippori Mincho', serif; color: var(--sumi); font-weight: 500; }
  .note-devoir { font-size: 11px; color: #aaa; }
  .note-valeur {
    font-size: 22px;
    font-weight: 700;
    font-family: 'Shippori Mincho', serif;
    letter-spacing: 1px;
    min-width: 100px;
    text-align: right;
  }
  .note-valeur.bonne { color: var(--bamboo); }
  .note-valeur.moyenne { color: var(--tea); }
  .note-valeur.basse { color: var(--vermilion); }
  .note-comp {
    font-size: 10px;
    color: #999;
    text-align: right;
    line-height: 1.6;
    min-width: 100px;
  }

  /* KPI */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi {
    background: white;
    border: 1px solid var(--line);
    padding: 24px;
    text-align: center;
    position: relative;
  }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 2px;
    background: var(--sakura-deep);
  }
  .kpi-val {
    font-size: 36px;
    font-family: 'Shippori Mincho', serif;
    color: var(--sakura-deep);
    font-weight: 500;
  }
  .kpi-label {
    font-size: 11px;
    color: #8a7a6e;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .kpi-kanji {
    font-size: 10px;
    color: var(--gold);
    margin-top: 4px;
  }

  /* CHART */
  .chart-container {
    background: white;
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 24px;
  }
  .chart-container h3 {
    font-family: 'Shippori Mincho', serif;
    color: var(--sakura-deep);
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
  }

  /* EDT GRILLE JAPONAISE */
  .edt-grid {
    display: grid;
    grid-template-columns: 60px repeat(6, 1fr);
    gap: 2px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .edt-cell {
    background: white;
    padding: 4px;
    min-height: 34px;
    position: relative;
    font-size: 11px;
  }
  .edt-cell.head {
    background: var(--washi-dark);
    color: var(--sakura-deep);
    text-align: center;
    padding: 8px 4px;
    font-family: 'Shippori Mincho', serif;
    font-weight: 500;
  }
  .edt-cell.head .ji-kanji {
    font-size: 18px;
    color: var(--gold);
    margin-bottom: 2px;
  }
  .edt-cell.head .ji-date {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .edt-cell.head.today {
    background: var(--sakura-light);
    color: var(--sakura-deep);
  }
  .edt-cell.head.today .ji-kanji {
    color: var(--sakura-deep);
  }
  .edt-cell.heure {
    background: var(--washi);
    color: #8a7a6e;
    text-align: center;
    padding: 6px 4px;
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    font-weight: 500;
  }
  .edt-cell.today {
    background: linear-gradient(180deg, #fff8f8 0%, var(--washi) 100%);
  }
  .cours-jp {
    background: var(--washi);
    border-left: 3px solid var(--sakura);
    padding: 4px 6px;
    margin-bottom: 2px;
    font-family: 'Sawarabi Mincho', serif;
  }
  .cours-jp .cours-matiere {
    color: var(--sumi);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.2;
  }
  .cours-jp .cours-heure {
    color: #8a7a6e;
    font-size: 9px;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .cours-jp .cours-salle {
    color: var(--sakura-deep);
    font-size: 10px;
    font-weight: 500;
    margin-top: 1px;
  }
  .cours-jp.annule {
    background: #f5e8e8;
    opacity: 0.5;
    text-decoration: line-through;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: #aaa;
    font-style: italic;
    font-family: 'Sawarabi Mincho', serif;
  }
  .empty .kanji {
    font-size: 64px;
    color: var(--sakura-light);
    margin-bottom: 16px;
    display: block;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 32px 20px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 3px;
    border-top: 1px solid var(--line);
    margin-top: 60px;
  }

  /* LOADER */
  #loader {
    position: fixed;
    inset: 0;
    background: var(--washi);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.5s;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .torii-loader {
    font-size: 64px;
    color: var(--sakura-deep);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
  }
  #loader .txt {
    margin-top: 20px;
    color: var(--sakura-deep);
    letter-spacing: 6px;
    font-size: 14px;
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    header h1 { font-size: 24px; letter-spacing: 6px; }
    nav.tabs button { padding: 12px 14px; font-size: 12px; letter-spacing: 2px; }
    .note-card { grid-template-columns: 1fr auto; gap: 8px; }
    .note-date, .note-comp { grid-column: 1 / -1; }
  }

  /* CONFIG WARNING */
  .config-warn {
    background: #FFF3CD;
    border: 1px solid #FFE69C;
    color: #856404;
    padding: 16px;
    margin: 16px 0;
    text-align: center;
    font-size: 13px;
  }
  .config-warn code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 2px; }
</style>
</head>
<body>

<!-- Décor pétales -->
<div class="sakura-bg" id="sakuraBg"></div>

<!-- Loader -->
<div id="loader">
  <div class="torii-loader">⛩</div>
  <div class="txt">CHARGEMENT</div>
</div>

<header>
  <div class="torii">⛩</div>
  <h1>Rosa</h1>
  <div class="kanji">ローザの宿題と成績</div>
  <div class="ornement"></div>
  <div class="date" id="dateJour"></div>
</header>

<nav class="tabs">
  <button class="active" data-tab="devoirs">
    <span class="kanji">宿題</span>DEVOIRS
  </button>
  <button data-tab="agenda">
    <span class="kanji">時間割</span>AGENDA
  </button>
  <button data-tab="priorites">
    <span class="kanji">優先</span>PRIORITÉS
  </button>
  <button data-tab="notes">
    <span class="kanji">成績</span>NOTES
  </button>
</nav>

<main>

  <!-- Bandeau config si URL non remplacée -->
  <div id="configWarn" class="config-warn" style="display:none;">
    ⚠️ Configuration requise : remplace <code>APPS_SCRIPT_URL</code> en haut du fichier <code>index.html</code> par l'URL de ton Apps Script déployé.
  </div>

  <!-- ONGLET DEVOIRS -->
  <section class="panel active" id="panel-devoirs">
    <div class="kpi-grid" id="kpiDevoirs"></div>
    <div id="devoirsListe"></div>
  </section>

  <!-- ONGLET AGENDA -->
  <section class="panel" id="panel-agenda">
    <div id="agendaSemaine"></div>
  </section>

  <!-- ONGLET PRIORITÉS -->
  <section class="panel" id="panel-priorites">
    <div id="prioritesListe"></div>
  </section>

  <!-- ONGLET NOTES -->
  <section class="panel" id="panel-notes">
    <div class="chart-container">
      <h3>Moyennes par matière · 平均点</h3>
      <canvas id="chartMoyennes" height="120"></canvas>
    </div>
    <div class="section-titre">
      <h2>Dernières notes</h2>
      <span class="kanji">最近の成績</span>
      <span class="ligne"></span>
    </div>
    <div id="notesListe"></div>
  </section>

</main>

<footer>
  🌸 Mis à jour : <span id="lastUpdate">—</span> · 桜の花
</footer>

<script>
/* ============================================================
 * CONFIG — remplace l'URL après déploiement de l'Apps Script
 * ============================================================ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY-UjH5sWQGgWAzFrjq3LcuMgdIKnBx6gVf5QRfjOdKgbwXZACYL9DonPtnDJ2pHPR/exec";

/* ============================================================
 * PÉTALES DE SAKURA
 * ============================================================ */
function spawnPetales() {
  const bg = document.getElementById('sakuraBg');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'petale';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    p.style.transform = `scale(${0.6 + Math.random() * 0.8})`;
    p.style.opacity = 0.3 + Math.random() * 0.5;
    bg.appendChild(p);
  }
}

/* ============================================================
 * DATE FR
 * ============================================================ */
function setDateJour() {
  const d = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('dateJour').textContent = d.toLocaleDateString('fr-FR', opts);
}

/* ============================================================
 * NAVIGATION ONGLETS
 * ============================================================ */
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ============================================================
 * LOAD DATA
 * ============================================================ */
let DATA = { devoirs: [], notes: [], edt: [], priorites: { moyennes: [], priorites: [] } };

async function loadData() {
  if (APPS_SCRIPT_URL.includes('REMPLACE_MOI')) {
    document.getElementById('configWarn').style.display = 'block';
    document.getElementById('loader').classList.add('done');
    renderEmptyAll();
    return;
  }
  try {
    const r = await fetch(APPS_SCRIPT_URL + '?action=all&t=' + Date.now());
    DATA = await r.json();
    if (DATA.error) throw new Error(DATA.error);
    document.getElementById('lastUpdate').textContent = new Date(DATA.updated || Date.now()).toLocaleString('fr-FR');
    render();
  } catch (e) {
    console.error(e);
    document.querySelector('main').insertAdjacentHTML('afterbegin',
      `<div class="config-warn">Erreur de chargement : ${e.message}</div>`);
    renderEmptyAll();
  } finally {
    setTimeout(() => document.getElementById('loader').classList.add('done'), 300);
  }
}

/* ============================================================
 * RENDER
 * ============================================================ */
function render() {
  renderDevoirs();
  renderAgenda();
  renderPriorites();
  renderNotes();
  renderChart();
}

function renderEmptyAll() {
  ['devoirsListe', 'prioritesListe', 'notesListe', 'agendaSemaine'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = `<div class="empty"><span class="kanji">空</span>Aucune donnée pour le moment</div>`;
  });
}

/* ----- AGENDA ----- */
function renderAgenda() {
  const edt = DATA.edt || [];
  const container = document.getElementById('agendaSemaine');
  if (edt.length === 0) {
    container.innerHTML = `<div class="empty"><span class="kanji">空</span>Pas d'emploi du temps</div>`;
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay() || 7;
  const monday = new Date(today); monday.setDate(monday.getDate() - dow + 1);
  const jours = [];
  for (let i = 0; i < 6; i++) { const d = new Date(monday); d.setDate(d.getDate() + i); jours.push(d); }
  const kanjisJours = ['月', '火', '水', '木', '金', '土']; // lun mar mer jeu ven sam

  const coursParJour = {};
  edt.forEach(c => {
    if (!c.start) return;
    const dStr = String(c.start).substring(0, 10);
    if (!coursParJour[dStr]) coursParJour[dStr] = [];
    coursParJour[dStr].push(c);
  });
  Object.values(coursParJour).forEach(arr => arr.sort((a,b) => String(a.start).localeCompare(String(b.start))));

  const heures = [];
  for (let h = 8; h <= 17; h++) heures.push(h);

  let html = `<div class="section-titre">
                <h2>Semaine du ${formatJour(monday)}</h2>
                <span class="kanji">今週</span>
                <span class="ligne"></span>
              </div>`;
  html += `<div class="edt-grid">`;
  html += `<div class="edt-cell head">時</div>`;
  jours.forEach((j, idx) => {
    const isToday = j.getTime() === today.getTime();
    const lbl = j.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit' });
    html += `<div class="edt-cell head ${isToday?'today':''}"><div class="ji-kanji">${kanjisJours[idx]}</div><div class="ji-date">${lbl}</div></div>`;
  });
  heures.forEach(h => {
    html += `<div class="edt-cell heure">${h}h</div>`;
    jours.forEach(j => {
      const isToday = j.getTime() === today.getTime();
      const dStr = j.toISOString().substring(0, 10);
      const courses = (coursParJour[dStr] || []).filter(c => {
        const startH = parseInt(String(c.start).substring(11, 13), 10);
        return startH === h;
      });
      let cellHtml = '';
      courses.forEach(c => {
        const startTime = String(c.start).substring(11, 16);
        const endTime = String(c.end).substring(11, 16);
        const annule = c.annule === 'Oui';
        cellHtml += `<div class="cours-jp ${annule ? 'annule' : ''}" style="border-left-color:${pickAgendaColor(c.couleur)}">
                       <div class="cours-matiere">${escapeHtml((c.matiere || '').substring(0, 22))}</div>
                       <div class="cours-heure">${startTime}–${endTime}</div>
                       ${c.salle ? `<div class="cours-salle">${escapeHtml(c.salle)}</div>` : ''}
                     </div>`;
      });
      html += `<div class="edt-cell${isToday ? ' today' : ''}">${cellHtml}</div>`;
    });
  });
  html += `</div>`;

  // Aujourd'hui détaillé
  const dStrToday = today.toISOString().substring(0, 10);
  const aujourdhui = coursParJour[dStrToday] || [];
  if (aujourdhui.length > 0) {
    html += `<div class="section-titre">
               <h2>Aujourd'hui</h2>
               <span class="kanji">本日</span>
               <span class="ligne"></span>
             </div>`;
    aujourdhui.forEach(c => {
      const startTime = String(c.start).substring(11, 16);
      const endTime = String(c.end).substring(11, 16);
      const annule = c.annule === 'Oui';
      const color = pickAgendaColor(c.couleur);
      html += `<div class="card ${annule ? 'fait' : ''}" style="border-left:4px solid ${color}">
                 <div class="card-head">
                   <div style="flex:1">
                     <div class="card-matiere">${escapeHtml(c.matiere || '')} ${annule ? '<span style="color:var(--vermilion); font-size:11px; letter-spacing:2px;">⚠ ANNULÉ</span>' : ''}</div>
                     <div style="color:#8a7a6e; font-size:13px; margin-top:4px; font-family:'Sawarabi Mincho';">${c.prof || ''}${c.salle ? ' · 📍 ' + c.salle : ''}</div>
                   </div>
                   <div class="card-meta">
                     <div class="card-date" style="font-size:13px;">${startTime}<br>${endTime}</div>
                   </div>
                 </div>
               </div>`;
    });
  }
  container.innerHTML = html;
}
function pickAgendaColor(c) {
  if (!c) return 'var(--sakura-deep)';
  // Palette pastel washi
  const palette = ['#8B3A3A', '#7BA77B', '#C9A370', '#6B7B9C', '#B07C9C', '#A0856B', '#5C8A8A', '#C97070'];
  let h = 0;
  for (let i = 0; i < c.length; i++) h = (h*31 + c.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];
}

/* ----- DEDUPLICATION ----- */
function dedup(liste) {
  // Regroupe par (date_remise, matiere) et garde la version sans "Ã" (UTF-8 cassé)
  const groupes = {};
  liste.forEach(d => {
    const dateKey = d.date_remise ? String(d.date_remise).substring(0, 10) : '';
    const key = `${dateKey}|${d.matiere || ''}`;
    const hasMojibake = /Ã[©¨ªà¢ç]/.test(d.contenu || '');
    if (!groupes[key]) {
      groupes[key] = { entry: d, mojibake: hasMojibake };
    } else if (groupes[key].mojibake && !hasMojibake) {
      // Préfère la version propre
      groupes[key] = { entry: d, mojibake: false };
    } else if (groupes[key].entry.fait !== d.fait) {
      // Si l'une est cochée, garde la cochée
      if (d.fait) groupes[key] = { entry: d, mojibake: hasMojibake };
    }
  });
  return Object.values(groupes).map(g => g.entry);
}

/* ----- DEVOIRS ----- */
function renderDevoirs() {
  const liste = dedup(DATA.devoirs || []);
  const today = new Date(); today.setHours(0,0,0,0);
  const demain = new Date(today); demain.setDate(demain.getDate() + 1);

  // KPIs
  const aFaire = liste.filter(d => !d.fait && new Date(d.date_remise) >= today);
  const pourDemain = liste.filter(d => {
    const dr = new Date(d.date_remise); dr.setHours(0,0,0,0);
    return dr.getTime() === demain.getTime();
  });
  const faits = liste.filter(d => d.fait);
  const enRetard = liste.filter(d => !d.fait && new Date(d.date_remise) < today);

  document.getElementById('kpiDevoirs').innerHTML = `
    <div class="kpi"><div class="kpi-val">${aFaire.length}</div><div class="kpi-label">À FAIRE</div><div class="kpi-kanji">残り</div></div>
    <div class="kpi"><div class="kpi-val">${pourDemain.length}</div><div class="kpi-label">DEMAIN</div><div class="kpi-kanji">明日</div></div>
    <div class="kpi"><div class="kpi-val">${faits.length}</div><div class="kpi-label">FAITS</div><div class="kpi-kanji">完了</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--vermilion)">${enRetard.length}</div><div class="kpi-label">EN RETARD</div><div class="kpi-kanji">遅刻</div></div>
  `;

  if (liste.length === 0) {
    document.getElementById('devoirsListe').innerHTML =
      `<div class="empty"><span class="kanji">空</span>Aucun devoir saisi</div>`;
    return;
  }

  // Regrouper par date
  const groupes = {};
  liste.forEach(d => {
    const k = d.date_remise || 'inconnue';
    (groupes[k] = groupes[k] || []).push(d);
  });

  const keys = Object.keys(groupes).sort();
  let html = '';
  keys.forEach(dateStr => {
    const dDate = new Date(dateStr);
    const label = formatDateGroupe(dDate, today, demain);
    html += `<div class="section-titre">
               <h2>${label}</h2>
               <span class="kanji">${kanjiDate(dDate)}</span>
               <span class="ligne"></span>
             </div>`;
    groupes[dateStr].forEach(d => html += cardDevoir(d, today, demain));
  });
  document.getElementById('devoirsListe').innerHTML = html;

  // Wire checkboxes
  document.querySelectorAll('.check-fait').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      const fait = e.target.checked;
      const card = e.target.closest('.card');
      card.classList.toggle('fait', fait);
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'toggle_fait', id: id, fait: fait })
        });
        // Mettre à jour DATA local
        const d = DATA.devoirs.find(x => x.id === id);
        if (d) d.fait = fait;
        renderDevoirs();
      } catch (err) {
        alert('Erreur sauvegarde : ' + err.message);
        e.target.checked = !fait;
      }
    });
  });
}

function cardDevoir(d, today, demain) {
  const dr = new Date(d.date_remise); dr.setHours(0,0,0,0);
  const jours = Math.ceil((dr - today) / 86400000);
  let cls = 'card';
  if (d.fait) cls += ' fait';
  else if (jours <= 0) cls += ' urgent';
  else if (jours === 1) cls += ' important';

  let badge = '';
  if (!d.fait) {
    if (jours < 0) badge = `<span class="badge urgent">EN RETARD</span>`;
    else if (jours === 0) badge = `<span class="badge urgent">AUJOURD'HUI</span>`;
    else if (jours === 1) badge = `<span class="badge demain">DEMAIN</span>`;
    else if (jours <= 3) badge = `<span class="badge important">DANS ${jours}J</span>`;
    else badge = `<span class="badge normal">DANS ${jours}J</span>`;
  }

  return `
    <div class="card ${cls}">
      <div class="card-head">
        <input type="checkbox" class="check-fait" data-id="${d.id}" ${d.fait ? 'checked' : ''}>
        <div style="flex:1">
          <div class="card-matiere">${escapeHtml(d.matiere || '?')}</div>
          ${badge}
        </div>
        <div class="card-meta">
          <div class="card-date">${formatJour(dr)}</div>
        </div>
      </div>
      <div class="contenu">${escapeHtml(d.contenu || '(aucun détail)')}</div>
    </div>`;
}

function formatDateGroupe(d, today, demain) {
  const t = d.getTime();
  if (t === today.getTime()) return "AUJOURD'HUI";
  if (t === demain.getTime()) return "DEMAIN";
  if (t < today.getTime()) return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase() + ' (passé)';
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
}
function formatJour(d) { return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); }
function kanjiDate(d) {
  const j = ['日', '月', '火', '水', '木', '金', '土'];
  return j[d.getDay()] + '曜日';
}

/* ----- PRIORITÉS ----- */
function renderPriorites() {
  const prio = dedup((DATA.priorites && DATA.priorites.priorites) || []);

  if (prio.length === 0) {
    document.getElementById('prioritesListe').innerHTML =
      `<div class="empty"><span class="kanji">完</span>Tous les devoirs sont faits ! 素晴らしい !</div>`;
    return;
  }

  const urgent = prio.filter(p => p.niveau === 'URGENT');
  const important = prio.filter(p => p.niveau === 'IMPORTANT');
  const normal = prio.filter(p => p.niveau === 'NORMAL');

  let html = `
    <div class="card" style="background: #FFF8F0; border-left: 3px solid var(--gold);">
      <div class="card-matiere">📜 Analyse des priorités</div>
      <div class="contenu">
        Le tri tient compte de <b>l'urgence</b> (date de remise) et de tes <b>moyennes</b>
        (les matières les plus faibles passent en premier).
      </div>
    </div>`;

  if (urgent.length) {
    html += sectionTitre('Urgent', '緊急');
    urgent.forEach(p => html += cardPrio(p, 'urgent'));
  }
  if (important.length) {
    html += sectionTitre('Important', '重要');
    important.forEach(p => html += cardPrio(p, 'important'));
  }
  if (normal.length) {
    html += sectionTitre('Normal', '普通');
    normal.forEach(p => html += cardPrio(p, 'normal'));
  }
  document.getElementById('prioritesListe').innerHTML = html;
}

function sectionTitre(titre, kanji) {
  return `<div class="section-titre">
            <h2>${titre}</h2>
            <span class="kanji">${kanji}</span>
            <span class="ligne"></span>
          </div>`;
}

function cardPrio(p, cls) {
  const moy = p.moyenne_matiere !== null && p.moyenne_matiere !== undefined
    ? `<span style="font-size:11px; color:#999;">moy: <b style="color:${moyCouleur(p.moyenne_matiere)}">${p.moyenne_matiere}/20</b></span>`
    : '';
  const jours = p.jours_restants;
  let restant;
  if (jours < 0) restant = `<span class="badge urgent">EN RETARD ${-jours}j</span>`;
  else if (jours === 0) restant = `<span class="badge urgent">AUJOURD'HUI</span>`;
  else if (jours === 1) restant = `<span class="badge demain">DEMAIN</span>`;
  else restant = `<span class="badge ${cls}">DANS ${jours}j</span>`;

  return `
    <div class="card ${cls}">
      <div class="card-head">
        <div style="flex:1">
          <div class="card-matiere">${escapeHtml(p.matiere)}</div>
          ${restant} ${moy}
        </div>
        <div class="card-meta">
          <div class="card-date">${formatJour(new Date(p.date_remise))}</div>
        </div>
      </div>
      <div class="contenu">${escapeHtml(p.contenu || '')}</div>
    </div>`;
}

function moyCouleur(m) { return m >= 14 ? 'var(--bamboo)' : m >= 10 ? 'var(--tea)' : 'var(--vermilion)'; }

/* ----- NOTES ----- */
function renderNotes() {
  const notes = DATA.notes || [];
  if (notes.length === 0) {
    document.getElementById('notesListe').innerHTML =
      `<div class="empty"><span class="kanji">空</span>Aucune note pour le moment</div>`;
    return;
  }

  // Grouper par matière + calculer moyenne pondérée par coef
  const parMatiere = {};
  notes.forEach(n => {
    const m = n.matiere || '?';
    if (!parMatiere[m]) parMatiere[m] = { notes: [], sumPts: 0, sumCoef: 0 };
    parMatiere[m].notes.push(n);
    const val = parseFloat(String(n.note).replace(',', '.'));
    const sur = parseFloat(n.sur) || 20;
    const coef = parseFloat(n.coef) || 1;
    if (!isNaN(val) && sur > 0) {
      parMatiere[m].sumPts += (val / sur * 20) * coef;
      parMatiere[m].sumCoef += coef;
    }
  });

  // Moyenne générale (moyenne des moyennes par matière)
  let total = 0, nbMat = 0;
  Object.values(parMatiere).forEach(g => {
    if (g.sumCoef > 0) { total += g.sumPts / g.sumCoef; nbMat++; }
  });
  const moyGen = nbMat > 0 ? (total / nbMat) : null;
  const moyGenCls = moyGen === null ? '' : moyGen >= 14 ? 'bonne' : moyGen >= 10 ? 'moyenne' : 'basse';

  let html = `<div class="moy-generale">
                <div class="moy-gen-label"><span class="kanji-gold">総合平均</span>MOYENNE GÉNÉRALE</div>
                <div class="moy-gen-val ${moyGenCls}">${moyGen === null ? '—' : moyGen.toFixed(2)}<small>/20</small></div>
                <div class="moy-gen-sub">${nbMat} matières · ${notes.length} notes</div>
              </div>`;

  // Trier matières : moyenne la plus basse en premier (à travailler)
  const matieres = Object.entries(parMatiere).map(([m, g]) => ({
    matiere: m,
    moyenne: g.sumCoef > 0 ? g.sumPts / g.sumCoef : null,
    notes: g.notes.slice().sort((a, b) => new Date(b.date) - new Date(a.date)),
  })).sort((a, b) => (a.moyenne ?? 99) - (b.moyenne ?? 99));

  matieres.forEach(mat => {
    const cls = mat.moyenne === null ? '' : mat.moyenne >= 14 ? 'bonne' : mat.moyenne >= 10 ? 'moyenne' : 'basse';
    html += `<div class="matiere-bloc">
               <div class="matiere-head">
                 <div class="matiere-titre">${escapeHtml(mat.matiere)}</div>
                 <div class="matiere-moy ${cls}">${mat.moyenne === null ? '—' : mat.moyenne.toFixed(2)}<small>/20</small></div>
               </div>
               <div class="matiere-meta">${mat.notes.length} note${mat.notes.length > 1 ? 's' : ''}</div>
               <div class="matiere-notes">`;
    mat.notes.forEach(n => {
      const val = parseFloat(String(n.note).replace(',', '.'));
      const sur = parseFloat(n.sur) || 20;
      const ratio = !isNaN(val) ? (val / sur * 20) : null;
      const nCls = ratio === null ? '' : ratio >= 14 ? 'bonne' : ratio >= 10 ? 'moyenne' : 'basse';
      const comp = n.moy_classe ? `<span class="note-classe-info">classe ${n.moy_classe} · min ${n.min_classe} · max ${n.max_classe}</span>` : '';
      const coefStr = (parseFloat(n.coef) || 1) !== 1 ? ` <span class="note-coef">×${n.coef}</span>` : '';
      html += `<div class="note-ligne">
                 <div class="note-date-jp">${formatJour(new Date(n.date))}</div>
                 <div class="note-devoir-jp">${escapeHtml(n.devoir || '—')}${coefStr}${comp ? '<br>' + comp : ''}</div>
                 <div class="note-valeur-jp ${nCls}">${n.note}<small>/${n.sur}</small></div>
               </div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('notesListe').innerHTML = html;
}

/* ----- CHART ----- */
function renderChart() {
  const moy = (DATA.priorites && DATA.priorites.moyennes) || [];
  const filtered = moy.filter(m => m.moyenne !== null);
  if (filtered.length === 0) return;
  const ctx = document.getElementById('chartMoyennes');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: filtered.map(m => m.matiere),
      datasets: [{
        label: 'Moyenne /20',
        data: filtered.map(m => m.moyenne),
        backgroundColor: filtered.map(m => m.moyenne >= 14 ? '#7BA77B' : m.moyenne >= 10 ? '#C9A370' : '#C97070'),
        borderRadius: 2,
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, max: 20, grid: { color: '#F0E5D8' } },
        y: { grid: { display: false } }
      }
    }
  });
}

/* ----- UTIL ----- */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/* ============================================================
 * INIT
 * ============================================================ */
spawnPetales();
setDateJour();
loadData();
</script>

</body>
</html>
